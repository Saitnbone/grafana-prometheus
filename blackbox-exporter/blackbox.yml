modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2"]
      valid_status_codes: [200]
      method: GET
      headers:
        User-Agent: Prometheus-Blackbox-Exporter
      fail_if_body_not_matches_regexp:
        - "ok|success|healthy"
      
  http_post_2xx:
    prober: http
    timeout: 10s
    http:
      method: POST
      headers:
        Content-Type: application/json
      body: '{"health": "check"}'
      valid_status_codes: [200, 201]
      
  tcp_connect:
    prober: tcp
    timeout: 5s
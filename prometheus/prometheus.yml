global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: 
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
    # сюда эндпоинты для проверки на проде заменить продовыми с эндпоинтами
    # на фронтах прокинуть эндпоинты на бэкенд, чтоб прометей мог их проверить
      - targets:
          - http://host.docker.internal:3011/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

